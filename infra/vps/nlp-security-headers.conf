# ---------------------------------------------------------------------------
# Security headers for HTML responses.
#
#   sudo cp nlp-security-headers.conf /etc/nginx/snippets/
#
# Identical to frontend/security-headers.inc, which is the container tier's
# copy. See that file for why each directive is what it is — in particular why
# style-src needs 'unsafe-inline' and script-src does not.
#
# Two copies rather than one shared file because the container image and the
# VPS have no filesystem in common. If they ever diverge, the container is the
# reference: it is the one CI validates on every pull request.
# ---------------------------------------------------------------------------

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=()" always;
