# ---------------------------------------------------------------------------
# nginx site for a single-host deployment.
#
#   sudo cp nginx-site.conf /etc/nginx/sites-available/nlp
#   sudo ln -s /etc/nginx/sites-available/nlp /etc/nginx/sites-enabled/nlp
#   sudo certbot --nginx -d learn.example.com
#   sudo nginx -t && sudo systemctl reload nginx
#
# certbot rewrites the TLS block below; the rest is left alone.
# ---------------------------------------------------------------------------

limit_req_zone $binary_remote_addr zone=nlp_api:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name learn.example.com;

    # ACME challenges must stay on port 80 for renewal to work.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name learn.example.com;

    ssl_certificate     /etc/letsencrypt/live/learn.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/learn.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    root /opt/nlp/frontend;
    index index.html;

    server_tokens off;
    client_max_body_size 4m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/manifest+json image/svg+xml;

    # TLS terminates here, so this is the right place for HSTS.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # No `expires` here: it emits its own Cache-Control, and two of them on one
    # response is ambiguous. The whole directive is set in one place.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    location ~* \.map$ {
        return 404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        include /etc/nginx/snippets/nlp-security-headers.conf;
    }

    location /api/ {
        limit_req zone=nlp_api burst=40 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        include /etc/nginx/snippets/nlp-security-headers.conf;
    }
}
