# ---------------------------------------------------------------------------
# Web tier: serves the static bundle and reverse-proxies /api.
#
# This is where the *application's* Content-Security-Policy lives. The API sends
# its own, far stricter policy (`default-src 'none'`), but that one only governs
# API responses; the policy that protects the running application is the one
# attached to index.html, and it belongs here.
# ---------------------------------------------------------------------------

# Rate limit at the edge as well as in the application. The app limiter is
# per-process and resets on restart; this one covers the whole tier and costs
# nothing per request.
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

# Version disclosure tells a scanner which CVEs to try first.
server_tokens off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Matches the API's own limit, so an oversized upload is refused at the
    # edge rather than travelling to the application first.
    client_max_body_size 4m;
    client_body_timeout 15s;
    client_header_timeout 15s;

    # Compression matters here: the JS bundle is the largest asset and gzip
    # roughly thirds it.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # Vite emits content-hashed filenames, so these can never go stale.
    #
    # `expires` is deliberately absent: it emits its own Cache-Control, and
    # combined with the one below the response carried the header twice —
    # once without `immutable`. Which of the two a client honours is not
    # defined, so the whole directive is set in one place.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # Source maps are built for release-time debugging and are not for the
    # public: they hand out the unminified application.
    location ~* \.map$ {
        return 404;
    }

    # The entry point must never be cached, or a deploy would keep serving the
    # old bundle references to returning visitors.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        include /etc/nginx/conf.d/security-headers.inc;
    }

    # Same-origin API proxy — keeps the httpOnly refresh cookie first-party.
    location /api/ {
        limit_req zone=api burst=40 nodelay;
        limit_req_status 429;

        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;

        # The API sets its own security headers; duplicating them here would
        # emit each one twice.
    }

    # Client-side routing: unknown paths fall through to the SPA, which renders
    # either the route or its own 404 page.
    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/conf.d/security-headers.inc;
    }
}
