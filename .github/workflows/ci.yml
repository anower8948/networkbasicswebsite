# ---------------------------------------------------------------------------
# Continuous integration.
#
# The backend suite runs **twice**: once on SQLite (fast, the developer's
# environment) and once on PostgreSQL (what production runs). The portable
# column types in `app/db/types.py` exist precisely because those two dialects
# differ, and a matrix is the only way to know the abstraction still holds.
# ---------------------------------------------------------------------------

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: sqlite
            url: sqlite+aiosqlite:///./ci.db
          - database: postgres
            url: postgresql+asyncpg://postgres:postgres@localhost:5432/nlp_ci

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nlp_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check app tests
          ruff format --check app tests

      - name: Type-check
        run: mypy app

      - name: Migrations match the models
        env:
          DATABASE_URL: ${{ matrix.url }}
        run: |
          alembic upgrade head
          alembic check

      - name: Test
        env:
          DATABASE_URL: ${{ matrix.url }}
        run: pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test -- --run

      - name: Build
        run: npm run build

  images:
    name: Container images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      # Building both images on every PR is what stops a Dockerfile breaking
      # only at deploy time, when it is most expensive to find out.
      - name: Build API image
        run: docker build -t nlp-api:ci ./backend

      - name: Build web image
        run: docker build -t nlp-web:ci ./frontend

      - name: nginx configuration is valid
        run: |
          docker run --rm --add-host api:127.0.0.1 nlp-web:ci nginx -t

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python advisories
        working-directory: backend
        run: |
          pip install pip-audit
          # Reported, not enforced: a fresh advisory with no fix available
          # should not block an unrelated change from shipping.
          pip-audit --desc || true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm advisories
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=high || true
